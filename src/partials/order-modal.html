<div class="order-modal" data-order>
  <div class="order-modal__container">
    <button
      class="order-modal__close"
      type="button"
      aria-label="Закрити модальне вікно"
    >
      <svg class="ic-cross" width="24" height="24">
        <use href="./images/icons.svg#cross"></use>
      </svg>
    </button>

    <h2 class="order-modal__title">Оформлення замовлення</h2>

    <form class="order-modal__form">
      <div class="order-modal__field">
        <label class="order-modal__label" for="order-name"> Ім’я* </label>
        <input
          class="order-modal__input"
          id="order-name"
          type="text"
          name="name"
          placeholder="Вікторія"
          required
          minlength="2"
          maxlength="50"
          pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ\s]+"
          title="Ім’я може містити лише літери та пробіли"
        />
      </div>

      <div class="order-modal__field">
        <label class="order-modal__label" for="order-phone"> Телефон* </label>
        <input
          class="order-modal__input"
          id="order-phone"
          type="tel"
          name="phone"
          placeholder="38 0__ ______"
          required
          pattern="^\+?[0-9]\s?(-)?[0-9]{10,20}$"
          title="Введіть коректний номер телефону"
        />
      </div>

      <div class="order-modal__field">
        <label class="order-modal__label" for="order-comment">
          Коментар*
        </label>
        <textarea
          class="order-modal__textarea"
          id="order-comment"
          name="comment"
          placeholder="Ваш коментар"
          required
        ></textarea>
      </div>

      <button class="order-modal__submit" type="submit">
        Надіслати заявку
      </button>
    </form>
  </div>
</div>
